{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px; margin:4rem auto;">
    <h2>{{ _('Choose a new password') }}</h2>
    <form method="post">
        <div class="form-group">
            <label for="password">{{ _('New password') }}</label>
            <input type="password" id="password" name="password" minlength="8" required autofocus>
        </div>
        <div class="form-group">
            <label for="confirm">{{ _('Confirm password') }}</label>
            <input type="password" id="confirm" name="confirm" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">{{ _('Set new password') }}</button>
    </form>
</div>
{% endblock %}
