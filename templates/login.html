{% extends "base.html" %}
{% block content %}
<div class="card auth-card">
    <h2>{{ _('Log in') }}</h2>
    <form method="post">
        {% if request.args.get('next') %}
        <input type="hidden" name="next" value="{{ request.args.get('next') }}">
        {% endif %}
        <div class="form-group">
            <label for="username">{{ _('Username') }}</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">{{ _('Password') }}</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">{{ _('Log in') }}</button>
    </form>
    <p class="hint">{{ _("Don't have an account?") }} <a href="{{ url_for('register') }}">{{ _('Register') }}</a></p>
    <p class="hint"><a href="{{ url_for('forgot_password') }}">{{ _('Forgot your password?') }}</a></p>
</div>
{% endblock %}
