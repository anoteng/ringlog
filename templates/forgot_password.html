{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px; margin:4rem auto;">
    <h2>{{ _('Reset password') }}</h2>
    <p>{{ _("Enter your email address and we'll send you a reset link.") }}</p>
    <form method="post">
        <div class="form-group">
            <label for="email">{{ _('Email address') }}</label>
            <input type="email" id="email" name="email" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">{{ _('Send reset link') }}</button>
    </form>
    <p class="hint" style="margin-top:1rem;"><a href="{{ url_for('login') }}">{{ _('Back to login') }}</a></p>
</div>
{% endblock %}
