{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>{{ 'Edit Bird' if bird else 'Register New Bird' }}</h2>
    {% if owner.id != current_user.id %}
    <p style="color:#888; font-size:0.9rem; margin-top:0.25rem;">Adding to {{ owner.username }}'s flock</p>
    {% endif %}
    <form method="post" enctype="multipart/form-data" style="margin-top:1rem;">
        <div class="form-row">
            <div class="form-group">
                <label for="ring_number">Ring Number *</label>
                <input type="text" id="ring_number" name="ring_number" required value="{{ bird.ring_number if bird else '' }}">
            </div>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Optional" value="{{ bird.name if bird and bird.name else '' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="species">Species *</label>
                <select id="species" name="species" required>
                    <option value="duck" {{ 'selected' if bird and bird.species == 'duck' }}>Duck</option>
                    <option value="hen" {{ 'selected' if bird and bird.species == 'hen' }}>Hen</option>
                </select>
            </div>
            <div class="form-group">
                <label for="sex">Sex</label>
                <select id="sex" name="sex">
                    <option value="unknown" {{ 'selected' if not bird or bird.sex == 'unknown' }}>Unknown</option>
                    <option value="female" {{ 'selected' if bird and bird.sex == 'female' }}>Female</option>
                    <option value="male" {{ 'selected' if bird and bird.sex == 'male' }}>Male</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="breed">Breed</label>
                <input type="text" id="breed" name="breed" placeholder="e.g. Pekin, Muscovy, hybrid" value="{{ bird.breed if bird and bird.breed else '' }}">
            </div>
            <div class="form-group" id="mix-group" style="display:none;">
                <label for="breed_mix">Hybrid Mix</label>
                <input type="text" id="breed_mix" name="breed_mix" placeholder="e.g. Pekin x Muscovy" value="{{ bird.breed_mix if bird and bird.breed_mix else '' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="birth_date">Date of Birth</label>
                <input type="date" id="birth_date" name="birth_date" value="{{ bird.birth_date if bird and bird.birth_date else '' }}">
            </div>
            <div class="form-group" style="display:flex; align-items:end; padding-bottom:0.5rem;">
                <div class="checkbox-group">
                    <input type="checkbox" id="birth_approximate" name="birth_approximate" {{ 'checked' if bird and bird.birth_approximate }}>
                    <label for="birth_approximate" style="font-weight:normal;">Approximate date</label>
                </div>
            </div>
        </div>

        {% if bird %}
        <div class="form-row">
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="is_dead" name="is_dead" {{ 'checked' if bird and bird.is_dead }}>
                    <label for="is_dead" style="font-weight:normal;">Deceased</label>
                </div>
            </div>
            <div class="form-group" id="death-date-group" style="{{ '' if bird and bird.is_dead else 'display:none;' }}">
                <label for="death_date">Date of Death</label>
                <input type="date" id="death_date" name="death_date" value="{{ bird.death_date if bird and bird.death_date else '' }}">
            </div>
        </div>
        {% endif %}

        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" placeholder="Any additional notes...">{{ bird.notes if bird and bird.notes else '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="image">Photo</label>
            {% if bird and bird.image %}
            <p style="margin-bottom:0.5rem;">
                <img src="{{ url_for('bird_image', bird_id=bird.id) }}" class="bird-image" alt="Current photo">
            </p>
            <div class="checkbox-group" style="margin-bottom:0.5rem;">
                <input type="checkbox" id="remove_image" name="remove_image">
                <label for="remove_image" style="font-weight:normal;">Remove current photo</label>
            </div>
            {% endif %}
            <input type="file" id="image" name="image" accept="image/*">
        </div>

        <button type="submit" class="btn btn-primary">{{ 'Save Changes' if bird else 'Register Bird' }}</button>
        <a href="{{ url_for('view_flock', username=owner.username) }}" style="margin-left:1rem;">Cancel</a>
    </form>
</div>

<script>
    const breedInput = document.getElementById('breed');
    const mixGroup = document.getElementById('mix-group');
    function toggleMix() {
        mixGroup.style.display = breedInput.value.toLowerCase().includes('hybrid') ? '' : 'none';
    }
    breedInput.addEventListener('input', toggleMix);
    toggleMix();

    const deadCheckbox = document.getElementById('is_dead');
    const deathGroup = document.getElementById('death-date-group');
    if (deadCheckbox && deathGroup) {
        deadCheckbox.addEventListener('change', () => {
            deathGroup.style.display = deadCheckbox.checked ? '' : 'none';
        });
    }
</script>
{% endblock %}
